name: build
# Regenerates robots/, server/, bots.csv, FAQ.md and the README table whenever the list changes, then runs the tests.
on:
  push:
    paths: [bots.json, myths.json, schema.ts, scripts/**]
  pull_request:
    paths: [bots.json, myths.json, schema.ts, scripts/**]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/build.ts
      - run: bun test
      - if: github.event_name == 'push'
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "build: regenerate from bots.json" && git push)
